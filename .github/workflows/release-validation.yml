name: Release validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate ANDS Nexus package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare ripgrep
        shell: bash
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi
          timeout 120s sudo apt-get update
          timeout 120s sudo apt-get install -y ripgrep
          rg --version

      - name: Run release validation tests
        shell: pwsh
        run: pwsh -NoProfile -File ./ands-nexus/scripts/test_validate_release.ps1
